name: Release

# Builds the signed binary, attaches it to a GitHub release and points the
# Homebrew formula at it. Deploy dispatches this after every merge to main; a
# hand-pushed vX.Y.Z tag (e.g. a minor bump) still triggers it directly.
on:
  push:
    tags:
      - "v*"
  # Deploy pushes release tags using the default GITHUB_TOKEN, and pushes
  # authenticated that way don't trigger other workflows (a deliberate GitHub
  # anti-recursion rule) — so the `push: tags` trigger above never fires for
  # automated tags. Deploy calls this dispatch instead.
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g. v1.2.3)"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      # workflow_dispatch can be triggered manually with any string, and
      # inputs.tag feeds straight into checkout's ref: below — reject anything
      # that isn't an exact vX.Y.Z tag before it's used as a ref.
      - name: Validate tag input
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::invalid tag input: $TAG (want vX.Y.Z)" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version
        id: version
        env:
          TAG_REF: ${{ inputs.tag || github.ref_name }}
        run: |
          echo "tag=$TAG_REF" >> "$GITHUB_OUTPUT"
          echo "version=${TAG_REF#v}" >> "$GITHUB_OUTPUT"

      # Same import as moomux-mac's release.yml: the Developer ID cert into a
      # throwaway keychain that dies with the runner.
      - name: Import signing certificate
        env:
          P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # A stray return in either secret fails only as "passphrase not
          # correct"; base64 has no whitespace and a password no line break.
          P12_BASE64=$(printf '%s' "$P12_BASE64" | tr -d ' \t\r\n')
          P12_PASSWORD=${P12_PASSWORD%%[$'\r\n']*}
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      # IDENTITY as a substring codesign matches against the one cert just
      # imported; the Makefile's own lookup needs rg, which the runner lacks.
      - name: Build and sign
        run: make dist IDENTITY="Developer ID Application"

      - name: Checksum
        id: archive
        run: |
          name="agent-usage-${{ steps.version.outputs.tag }}.zip"
          mv dist/agent-usage.zip "$name"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha256=$(shasum -a 256 "$name" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ steps.version.outputs.tag }}" "${{ steps.archive.outputs.name }}" \
            --title "${{ steps.version.outputs.tag }}" --generate-notes

      - name: Publish Homebrew formula
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          ZIP: ${{ steps.archive.outputs.name }}
          SHA256: ${{ steps.archive.outputs.sha256 }}
        run: |
          # gh as git's credential helper, or the plain `git push` below has
          # nothing to authenticate with on a headless runner.
          gh auth setup-git

          rm -rf /tmp/tap
          gh repo clone afitzgerald/homebrew-agent-usage /tmp/tap
          mkdir -p /tmp/tap/Formula

          # `service do` is the launchd job `make install` writes by hand:
          # `brew services start agent-usage` loads it.
          cat > /tmp/tap/Formula/agent-usage.rb <<EOF
          class AgentUsage < Formula
            desc "Tracks Claude Code usage and writes it to a file any app can read"
            homepage "https://github.com/afitzgerald/agent-usage"
            url "https://github.com/afitzgerald/agent-usage/releases/download/${TAG}/${ZIP}"
            version "${VERSION}"
            sha256 "${SHA256}"
            license "MIT"

            depends_on macos: :sonoma

            def install
              bin.install "agent-usage"
            end

            service do
              run [opt_bin/"agent-usage", "refresh"]
              run_type :interval
              interval 300
              process_type :background
              log_path "#{Dir.home}/Library/Logs/agent-usage.log"
              error_log_path "#{Dir.home}/Library/Logs/agent-usage.log"
            end

            test do
              assert_match "selftest: ok", shell_output("#{bin}/agent-usage --selftest")
            end
          end
          EOF

          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/agent-usage.rb
          git commit -m "agent-usage ${TAG}"
          git push
